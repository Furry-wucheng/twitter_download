[project]
name = "twitter-download-fork"
version = "0.2.0"
description = "X/Twitter media downloader with multi-profile desktop controls"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "pyside6>=6.8,<7",
    "xclienttransaction>=1.0.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"csv_gen.py" = ["SIM115"]
"md_gen.py" = ["SIM115"]
"reply_down.py" = ["SIM115"]
"tag_down.py" = ["SIM115"]
"text_down.py" = ["SIM115"]

[tool.pytest.ini_options]
pythonpath = ["."]
